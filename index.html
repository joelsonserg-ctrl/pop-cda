<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POP CDA — Acesso de Veículos (vídeo explicativo)</title>
<style>
:root{--bg:#eef2f8;--card:#fff;--tx:#0f1b2d;--bd:#d5dce8;--ac:#0b3a6e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#121c2e;--tx:#e6ecf5;--bd:#25324a;--ac:#5b9bf0}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#121c2e;--tx:#e6ecf5;--bd:#25324a;--ac:#5b9bf0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:1500px;margin:0 auto;padding:12px}
#vp{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#000;border-radius:8px}
#vp:fullscreen{aspect-ratio:auto;border-radius:0}
#fr{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
svg text{font-family:"Segoe UI",Roboto,Arial,sans-serif}
.ol{paint-order:stroke;stroke:#0b1220;stroke-width:4px;stroke-linejoin:round}
.fx{transition:opacity .5s}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.1}}
.blink{animation:bl .6s steps(1,end) infinite}
#vp.pz .blink{animation-play-state:paused}
.prog{height:5px;background:var(--bd);border-radius:3px;margin:10px 0}
.prog i{display:block;height:100%;width:0;background:#e8a317;border-radius:3px;transition:width .4s}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
button{font:inherit;font-size:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:6px;cursor:pointer}
button.p{background:#0b3a6e;color:#fff;border-color:#0b3a6e;min-width:120px}
label{font-size:13.5px;display:flex;gap:6px;align-items:center}
select{font:inherit;font-size:13px;max-width:240px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:7px}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.list button{text-align:left;font-size:13px}
.list button.on{border-color:#e8a317;box-shadow:inset 4px 0 0 #e8a317;font-weight:600}
small{display:block;margin-top:10px;font-size:12px;opacity:.75}
[hidden]{display:none!important}
.spd{display:flex;gap:4px;align-items:center;font-size:13.5px;flex-wrap:wrap}.spd button{padding:7px 10px;min-width:46px}
.spd button.on{background:#e8a317;border-color:#e8a317;color:#0b1220;font-weight:700}
.ov{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.bx{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px}
.bx h2{margin:0;font-size:20px;color:var(--ac)}.bx p{margin:0;font-size:14px;opacity:.8}
input[type=text],input[type=email],input[type=password]{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
.lk{background:none;border:0;color:var(--ac);text-decoration:underline;padding:4px}
.ms{font-size:13px;min-height:18px}
.adm{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-top:12px}
.adm table{width:100%;border-collapse:collapse;font-size:13.5px}.adm th,.adm td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd)}
.adm .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--bd);font-size:13.5px}
.chip{font-size:13px;opacity:.85}
</style></head><body><main>

const N=[
"Olá, morador! Você já parou para pensar no que leva um criminoso a escolher determinado local para agir? Muitas vezes, a resposta está em dois fatores: oportunidade e facilidade. Ele procura acessos vulneráveis, poucas barreiras e situações em que a entrada possa acontecer sem uma triagem adequada. É justamente para reduzir essas oportunidades que as camadas de proteção do nosso condomínio foram tecnicamente recomendadas pela Moked e, posteriormente, discutidas e aprovadas pelo conselho de moradores. Mas é importante entender um ponto: o objetivo não é burocratizar a sua rotina, nem criar obstáculos desnecessários no seu dia a dia. O verdadeiro propósito é proteger todos os moradores. A segurança do condomínio não depende apenas de quem entra, mas também de como essa entrada é realizada e de quais medidas existem para identificar possíveis riscos antes que seja tarde. Cada etapa do processo tem uma função: reduzir vulnerabilidades, ampliar a capacidade de prevenção e evitar que uma situação de risco ultrapasse os limites do condomínio. Mais do que controlar acessos, estamos protegendo pessoas, famílias e lares. E essa proteção começa com a participação consciente de cada morador.",
"Antes, o morador utilizava apenas a TAG para acessar o condomínio. Ao se aproximar, o portão externo abria automaticamente. A triagem era feita apenas por uma verificação visual na rua, sem um controle efetivo sobre o que acontecia durante o acesso. Imagine a seguinte situação. Um morador chega acompanhado de um passageiro. A equipe de segurança não identifica nenhuma suspeita naquele primeiro momento. A TAG libera a entrada. O veículo entra na eclusa. O morador realiza o reconhecimento facial e, em seguida, o portão interno abre automaticamente. O veículo passa. Mas, logo depois, o passageiro apresenta um alerta vermelho. Existe uma ameaça dentro do condomínio. E o mais preocupante é que, até aquele momento, a equipe de segurança não teve a oportunidade de impedir a entrada. Agora, veja como funciona o novo procedimento. Com o controle linear anticlonagem, o acesso deixa de depender apenas de uma liberação automática. O morador precisa realizar uma ação consciente, adicionando uma nova camada de segurança ao processo. O veículo entra na eclusa e passa pela triagem normal. O agente realiza a vistoria e o reconhecimento facial. Mas existe uma diferença fundamental. O reconhecimento facial, por si só, não libera o portão interno. A abertura depende do comando do agente de segurança, que solicita à portaria a autorização para liberar o acesso. Dessa forma, o veículo permanece dentro da eclusa até que a liberação seja confirmada. E é justamente nesse momento que a segurança faz a diferença. Se alguma irregularidade for identificada, a equipe ainda tem a oportunidade de agir antes que o veículo entre no condomínio. Mais controle, mais uma camada de proteção e uma oportunidade real de impedir que uma ameaça ultrapasse os limites do condomínio.",
["O sistema foi implantado para padronizar a entrada de veículos. O primeiro acionamento permite o acesso à eclusa e a realização da triagem. Quando o acionamento é usado na condição de pânico, o procedimento muda. A equipe realiza a abordagem e a verificação do veículo, conforme o protocolo.",
 "A presença de uma pessoa desconhecida no veículo não significa que ela seja uma ameaça. Significa que existe uma condição diferente, que precisa ser tratada conforme o procedimento.",
 "Mas o morador conhece a pessoa. Por que tratar como uma situação diferente? Porque o procedimento não é baseado em julgamento pessoal sobre quem é confiável. Ele estabelece critérios objetivos para a equipe agir de maneira padronizada. O morador pode conhecer o acompanhante, mas a equipe não conhece e precisa cumprir o protocolo definido para aquela condição.",
 "Não estamos dizendo que a pessoa é uma ameaça. Estamos dizendo que a situação exige um procedimento específico."],
"Primeira condição. O morador está sozinho, com o controle, e aciona o botão sem pânico. O agente acessa a eclusa e faz o visual ao redor do veículo, dando a volta completa. Em seguida, o morador faz a validação facial, e o agente solicita à portaria a abertura do portão interno. Após a liberação, o veículo acessa o condomínio.",
"Segunda condição. O morador está sozinho e aciona o botão de pânico. O agente acessa a eclusa. Em seguida, o morador faz a validação facial. O agente solicita que o porta-malas seja aberto, que a luz interna seja acesa e que os vidros permaneçam abertos. Não havendo suspeitos, o agente verifica com o morador o motivo do acionamento, que pode ter ocorrido por engano. Antes da liberação, o porta-malas é fechado. Após a conclusão do procedimento, o acesso pode ser liberado.",
"Terceira condição. O morador está acompanhado de uma pessoa desconhecida pela equipe de segurança e aciona o botão sem pânico. O agente acessa a eclusa. Em seguida, o morador realiza a validação facial. Após a validação, o agente solicita à portaria a abertura do portão interno. O acompanhante continua sinalizado em amarelo, pois ainda não é conhecido pela equipe de segurança. Isso não significa que exista uma ameaça, mas indica que se trata de uma condição diferente, que deve ser registrada conforme o procedimento.",
"Quarta condição. O morador está acompanhado de uma pessoa conhecida pela equipe de segurança e aciona o botão de pânico. O agente acessa a eclusa. Em seguida, o morador realiza a validação facial. O agente solicita a abertura do porta-malas, o acionamento da luz interna e a abertura dos vidros do veículo. Durante a verificação, o agente confirma com o morador o motivo do acionamento do pânico, que pode ter ocorrido por engano. Não havendo suspeitos, o porta-malas é fechado e o agente solicita à portaria a abertura do portão interno. Após a liberação, o veículo acessa o condomínio.",
"Quinta condição. O morador está acompanhado de uma pessoa desconhecida pela equipe de segurança e aciona o botão de pânico. O agente acessa a eclusa. Em seguida, o morador realiza a validação facial. O agente informa à portaria que há uma pessoa desconhecida no veículo e solicita a abertura do portão externo para que o acompanhante saia e realize o cadastro na portaria. Após a saída do acompanhante, o agente inicia a vistoria do veículo, solicitando a abertura do porta-malas e realizando a dupla checagem com o morador. Estando tudo em ordem, o porta-malas é fechado e a sinalização do acompanhante muda de amarelo para verde. O visitante é então liberado para acessar o condomínio pela entrada de pedestres, enquanto o veículo recebe autorização para entrar pelo portão interno. Dessa forma, todas as etapas de segurança são cumpridas antes da liberação do acesso.",
"Quando a portaria confirma uma situação real de pânico e aciona a Polícia Militar, o passageiro, que antes estava sinalizado em amarelo, passa a ficar vermelho e piscando. Isso indica uma ameaça confirmada. Ao identificar e confirmar a situação de pânico, a portaria também dispara um alerta remoto para a central de monitoramento 24 horas. A central, então, abre as imagens do condomínio, entra em contato com a equipe de segurança e aciona a Polícia Militar, prestando todo o apoio necessário. Paralelamente, a portaria inicia o plano de chamada, entrando em contato com a Polícia Militar e com os responsáveis pela segurança do condomínio. Nesse cenário, a equipe libera o portão externo para permitir a saída da ameaça. Porém, a entrada dessa pessoa não será autorizada em nenhuma hipótese, seja pela entrada social ou pelo acesso de pedestres. Mas o alerta não fica restrito à equipe de segurança. Os LEDs de alerta, instalados na parte externa do condomínio, na calçada junto aos acessos, começam a piscar. Esse sinal serve para orientar quem está chegando. Ao visualizar os LEDs acesos, a pessoa deve entender que existe uma situação de risco em andamento, não deve entrar no condomínio e precisa permanecer em segurança. O objetivo é alertar, impedir novos acessos e proteger todos que estão dentro e fora do condomínio.",
"Sexta condição. O morador está em um veículo de terceiros, acompanhado de uma pessoa desconhecida pela equipe de segurança, e não está com o controle de acesso. O motorista, sinalizado em amarelo, se apresenta e informa que veio visitar o morador, que está no veículo com ele. Como o morador está sem o controle, não tem como sinalizar uma situação de pânico nem realizar o acionamento normal de acesso. Por isso, nesse procedimento, a senha passa a ser o nome do acompanhante. Já dentro da eclusa, o morador deve informar ao agente o nome da pessoa que está com ele. Esse nome funciona como uma senha de segurança. Primeira situação: o morador informa o nome correto. Nesse caso, o agente entende que está tudo bem, e o acompanhante não precisa sair do veículo. Como não se trata de um acesso em condição de pânico, o agente não solicita a abertura do porta-malas nem o acionamento da luz interna. Ele solicita apenas que os vidros sejam abertos e realiza a vistoria externa do veículo, fazendo a volta sempre pela parte de trás. Ao finalizar a verificação, os vidros são fechados e a portaria libera a abertura do portão interno. Segunda situação: o morador não informa o nome do acompanhante. Em vez disso, diz qualquer outra coisa, como fazer um comentário sobre o tempo ou dizer que está frio. Essa resposta é interpretada como um sinal de pânico. Nesse caso, o acompanhante desconhecido deve sair do veículo. O agente solicita à portaria a abertura do portão externo e orienta que o acompanhante se dirija até a portaria para realizar o cadastro. Com o morador sozinho dentro da eclusa, o agente solicita a abertura do porta-malas, o acionamento da luz interna e realiza a vistoria do veículo, além de uma dupla checagem para confirmar quem realmente está no veículo. Após a verificação, sendo confirmado que se trata de um visitante, o acesso poderá ser autorizado, pois o morador já não está mais na presença de uma possível situação de coação. O visitante retorna ao veículo, o porta-malas é fechado e a portaria solicita a abertura do portão interno. Com isso, o acesso é concluído.",
["O risco que buscamos controlar é permitir um acesso sem que a equipe de segurança consiga identificar e tratar uma emergência ou uma situação que exija verificação adicional. Por isso, o controle de acesso precisa permitir três coisas: identificar a condição apresentada, responder de forma diferenciada e manter a rastreabilidade de cada acesso.",
 "É justamente para isso que existe o Procedimento Operacional Padrão, o POP. Ele estabelece como a equipe deve agir diante de um acionamento de pânico ou da ausência do controle de acesso do morador. Vamos entender as principais situações. Pânico acionado: é uma situação de emergência prevista no procedimento. A equipe realiza a verificação do veículo, incluindo a abertura do porta-malas. Acompanhante desconhecido: além da verificação, é necessário realizar o procedimento de identificação e cadastro do acompanhante. Acompanhante conhecido: a equipe também realiza a verificação do veículo, incluindo a abertura do porta-malas. Morador sem controle: é aplicada a verificação prevista no procedimento para essa condição.",
 "Veículo de terceiros, sem controle: nesse caso, vale a senha de segurança. O morador deve informar o nome do acompanhante que está com ele. Se o nome informado estiver correto, a situação não é considerada pânico. A vistoria é realizada com os vidros abertos e o agente faz a volta ao redor do veículo, sem necessidade de abrir o porta-malas ou acender a luz interna. Por outro lado, se o morador não informar o nome correto e disser qualquer outra coisa, a situação será tratada como pânico. Nesse caso, o procedimento exige a abertura do porta-malas, o acionamento da luz interna, a saída do acompanhante desconhecido para realizar o cadastro e uma dupla checagem com o morador.",
 "É importante entender um princípio fundamental: a equipe de segurança não decide com base na aparência ou na confiança pessoal. Ela identifica a condição apresentada e aplica o procedimento correspondente.",
 "Segurança não significa eliminar todos os riscos. Significa identificar as vulnerabilidades, estabelecer controles e preparar a operação para responder adequadamente a cada situação. Mas será que o procedimento garante que nada de errado vai acontecer? Não. Nenhum procedimento é capaz de eliminar completamente os riscos. O objetivo é reduzir a probabilidade de uma ocorrência e, quando ela acontecer, minimizar suas possíveis consequências. E existe um fator importante nessa estratégia: quanto mais camadas de proteção existem, mais obstáculos são criados para quem pretende agir contra o condomínio. Segurança é prevenção, controle e capacidade de resposta. E cada camada de proteção faz a diferença."],
"As entradas de pedestres também contam com camadas adicionais de segurança. Tanto na entrada social quanto no acesso de pedestres de serviços, existem eclusas, leitores de reconhecimento facial e um agente de segurança posicionado na calçada, atuando como uma barreira externa, sem perder de vista o respectivo acesso. Moradores e prestadores de serviços devidamente autorizados realizam o acesso normalmente, conforme os procedimentos estabelecidos. Já as pessoas sem autorização têm sua entrada impedida pela equipe de segurança. Do lado de fora, quem procura identificar vulnerabilidades pode até observar o condomínio em busca de oportunidades. Mas encontra acessos monitorados, barreiras físicas e procedimentos de segurança bem definidos. A proteção não acontece apenas nos portões de veículos. Ela também está presente em cada entrada de pedestres, reforçando a segurança de todo o condomínio.",
"Lembre-se: estas camadas de proteção não são excessos. Foram sugeridas tecnicamente pela Moked e decididas pelos moradores para proteger o patrimônio e as nossas famílias. Segurança coletiva se faz com a colaboração de todos. Contamos com você!"];

  c.innerHTML='<p><b>'+d.length+'</b> pessoas cadastradas · <b>'+tot+'</b> acessos no total</p><div style="overflow:auto"><table><tr><th>Nome</th><th>E-mail</th><th>Cadastro</th><th>Acessos</th><th>Último acesso</th></tr>'
   +d.map(x=>'<tr><td>'+esc(x.nome)+'</td><td>'+esc(x.email)+'</td><td>'+f(x.criado)+'</td><td>'+x.acessos+'</td><td>'+f(x.ultimo)+'</td></tr>').join('')+'</table></div>';}
 else{const none='sem áudio (usa a voz do navegador)';
  c.innerHTML='<p>Envie um arquivo de áudio (MP3, M4A ou WAV) por capítulo. A animação se ajusta sozinha à duração do áudio.'+(OPEN?' <b>Modo teste local:</b> os áudios valem só até fechar a página.':'')+'</p>'
   +NAMES.map((n,i)=>'<div class="row"><b style="min-width:230px">'+(i+1)+' · '+esc(n)+'</b><span id="as'+(i+1)+'">'+(AUD[i+1]?'✔ áudio carregado':none)+'</span><input type="file" accept="audio/*" data-c="'+(i+1)+'"><button data-r="'+(i+1)+'">Remover</button></div>').join('');
  c.querySelectorAll('input[type=file]').forEach(inp=>inp.onchange=async()=>{const cap=+inp.dataset.c,f=inp.files[0];if(!f)return;const s=$('as'+cap);s.textContent='Enviando…';
   try{await upAud(cap,f);s.textContent='✔ áudio carregado';}catch(e){s.textContent='Erro: '+(e.message||e);}});
  c.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{const cap=+b.dataset.r;try{await rmAud(cap);$('as'+cap).textContent=none;}catch(e){$('as'+cap).textContent='Erro: '+(e.message||e);}});}}
/* início */
(async function(){
 if(OPEN){ISADM=true;$('adm').hidden=false;$('usr').textContent='Modo teste local (sem login)';return;}
 $('lg').hidden=false;
 if(!window.supabase){$('lf').innerHTML='<h2>Serviço indisponível</h2><p>Não foi possível carregar o serviço de login. Verifique a conexão e recarregue a página.</p>';return;}
 SB=supabase.createClient(CFG.URL,CFG.KEY);
 const r=await SB.auth.getSession();if(r.data.session)await enter(r.data.session.user);})();
</script>
